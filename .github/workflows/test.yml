name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        st: [release, staging] # the SillyTavern commits pinned in tests/st-version.json
    name: test (SillyTavern ${{ matrix.st }})
    env:
      ST_REF: ${{ matrix.st }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the browser tests load the baseline's index.js from an older commit
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # V8 with (?i:) modifier groups, like current Chrome
          cache: npm
      - run: npm ci
      - name: ESLint (SillyTavern's rules)
        run: npm run lint && npm run test:eslint-sync
      - name: extractNeedle cases and differential fuzz
        run: npm run test:fuzz
      - name: Browser tests (headless Chrome, SillyTavern's real regex engine)
        run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Benchmark gate (warm display render vs tests/bench-baseline.json)
        if: matrix.st == 'staging'
        run: npm run bench -- --gate
        env:
          CHROME_PATH: /usr/bin/google-chrome
